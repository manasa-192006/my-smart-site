<!DOCTYPE html>
<html>
<head>
    <title>The Weather-Aware Site</title>
    <style>
        body { margin: 0; height: 100vh; display: flex; flex-direction: column; 
               justify-content: center; align-items: center; font-family: sans-serif; 
               transition: 2s; text-align: center; color: white; }
        .box { background: rgba(0,0,0,0.3); padding: 40px; border-radius: 20px; backdrop-filter: blur(10px); }
        h1 { font-size: 3rem; }
    </style>
</head>
<body>
    <div class="box">
        <h1 id="city">Checking the sky...</h1>
        <h2 id="temp">--°C</h2>
        <p id="description">One moment...</p>
    </div>

    <script>
        // PASTE YOUR API KEY BELOW
        const apiKey = "fecdd2b71d82f43595cea74798cdfb1d"; 
        const city = "London"; // Change this to your city!

        async function getWeather() {
            const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=${apiKey}`);
            const data = await response.json();
            
            const temp = Math.round(data.main.temp);
            const condition = data.weather[0].main; // e.g., "Rain", "Clear", "Clouds"

            document.getElementById('city').innerText = data.name;
            document.getElementById('temp').innerText = temp + "°C";
            document.getElementById('description').innerText = "It's " + condition + " outside.";

            // CHANGE THE COLOR BASED ON WEATHER
            if (condition === "Rain") {
                document.body.style.background = "#4b6cb7"; // Blue/Grey
            } else if (condition === "Clear") {
                document.body.style.background = "#f7b733"; // Orange/Yellow
            } else {
                document.body.style.background = "#757f9a"; // Grey for Clouds
            }
        }
        getWeather();
    </script>
</body>
</html>
